name: R2DBC Acceptance

on:
  push:
    branches: [master, "rel/*", "rc/*", feat/dev-r2dbc]
  pull_request:
    branches: [master, "rel/*", "rc/*", feat/dev-r2dbc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify fixture guards and TCK result contract
        run: python -m unittest discover -s iotdb-client/r2dbc/src/test/scripts -p "test_*.py"

  live:
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, tls, cluster]
    env:
      MAVEN_OPTS: -Xms512m -Xmx2g
      MAVEN_ARGS: --batch-mode --no-transfer-progress
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build current-commit server and install matching client dependencies
        # Installing JDBC is essential: the TCK fixture must use this checkout's
        # protocol classes, rather than an unrelated remote SNAPSHOT.
        run: ./mvnw -B --no-transfer-progress -pl distribution,iotdb-client/jdbc,iotdb-client/r2dbc-spring-data -am -DskipTests install
      - name: Run real-server acceptance
        run: >-
          python iotdb-client/r2dbc/src/test/scripts/run_acceptance.py
          --distribution distribution/target/apache-iotdb-2.0.11-SNAPSHOT-all-bin/apache-iotdb-2.0.11-SNAPSHOT-all-bin
          --run-root target/r2dbc-acceptance --mode ${{ matrix.mode }}
      - name: Keep sanitized evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r2dbc-${{ matrix.mode }}
          # private/ contains randomly generated credentials and key material.
          # Surefire's raw target XML also contains system properties. Upload
          # only the scrubbed copies produced by the runner.
          path: |
            target/r2dbc-acceptance/*/artifacts/**
          if-no-files-found: error
          retention-days: 7
