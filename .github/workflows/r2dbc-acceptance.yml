name: R2DBC Acceptance

on:
  push:
    branches: [master, "rel/*", "rc/*", feat/dev-r2dbc]
  pull_request:
    branches: [master, "rel/*", "rc/*", feat/dev-r2dbc]
  workflow_dispatch:
    inputs:
      run_soak:
        description: Run an additional sustained mixed workload
        type: boolean
        default: false
      soak_seconds:
        description: Sustained workload duration (seconds, max 5400)
        type: number
        default: 3600

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify fixture guards and TCK result contract
        run: python -m unittest discover -s iotdb-client/r2dbc/src/test/scripts -p "test_*.py"

  units:
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install matching driver and Spring dependencies
        run: ./mvnw -B --no-transfer-progress -pl iotdb-client/r2dbc-spring-data -am -DskipTests install
      - name: Resolve published POMs from standalone consumers
        run: >-
          python iotdb-client/r2dbc/src/test/scripts/check_consumer_runtime.py
          --work-dir target/r2dbc-consumer-runtime
          --summary target/r2dbc-unit/artifacts/consumer-runtime.json
      - name: Run all driver, Spring lifecycle and Dialect unit methods
        run: python iotdb-client/r2dbc/src/test/scripts/run_unit.py --artifacts target/r2dbc-unit/artifacts
      - name: Keep unit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r2dbc-units
          path: target/r2dbc-unit/artifacts/**
          if-no-files-found: error
          retention-days: 7

  live:
    needs: units
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: plain, mode: plain, protocol: binary, precision: ms }
          - { case: tls, mode: tls, protocol: binary, precision: ms }
          - { case: cluster, mode: cluster, protocol: binary, precision: ms }
          - { case: compact, mode: plain, protocol: compact, precision: ms }
          - { case: microseconds, mode: plain, protocol: binary, precision: us }
          - { case: nanoseconds, mode: plain, protocol: binary, precision: ns }
          - { case: mtls, mode: mtls, protocol: binary, precision: ms }
          - { case: tls-cluster, mode: tls-cluster, protocol: binary, precision: ms }
    env:
      MAVEN_OPTS: -Xms512m -Xmx2g
      MAVEN_ARGS: --batch-mode --no-transfer-progress
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build current-commit server and install matching client dependencies
        # Installing JDBC is essential: the TCK fixture must use this checkout's
        # protocol classes, rather than an unrelated remote SNAPSHOT.
        run: ./mvnw -B --no-transfer-progress -pl distribution,iotdb-client/jdbc,iotdb-client/r2dbc-spring-data -am -DskipTests install
      - name: Run real-server acceptance
        run: >-
          python iotdb-client/r2dbc/src/test/scripts/run_acceptance.py
          --distribution distribution/target/apache-iotdb-2.0.11-SNAPSHOT-all-bin/apache-iotdb-2.0.11-SNAPSHOT-all-bin
          --run-root target/r2dbc-acceptance --mode ${{ matrix.mode }}
          --protocol ${{ matrix.protocol }} --precision ${{ matrix.precision }}
      - name: Keep sanitized evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r2dbc-${{ matrix.case }}
          # private/ contains randomly generated credentials and key material.
          # Surefire's raw target XML also contains system properties. Upload
          # only the scrubbed copies produced by the runner.
          path: |
            target/r2dbc-acceptance/*/artifacts/**
          if-no-files-found: error
          retention-days: 7

  soak:
    if: github.event_name == 'workflow_dispatch' && inputs.run_soak
    needs: units
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOAK_SECONDS: ${{ inputs.soak_seconds }}
      MAVEN_OPTS: -Xms512m -Xmx2g
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate requested duration
        run: python -c "import os; n=int(os.environ['SOAK_SECONDS']); assert 1 <= n <= 5400"
      - name: Build matching server and clients
        run: ./mvnw -B --no-transfer-progress -pl distribution,iotdb-client/jdbc,iotdb-client/r2dbc-spring-data -am -DskipTests install
      - name: Run tracked sustained workload and resource checks
        run: >-
          python iotdb-client/r2dbc/src/test/scripts/run_acceptance.py
          --distribution distribution/target/apache-iotdb-2.0.11-SNAPSHOT-all-bin/apache-iotdb-2.0.11-SNAPSHOT-all-bin
          --run-root target/r2dbc-soak --mode plain --compatibility-only
          --soak-seconds "$SOAK_SECONDS" --timeout "$((SOAK_SECONDS + 600))"
      - name: Keep sustained workload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r2dbc-sustained-workload
          path: target/r2dbc-soak/*/artifacts/**
          if-no-files-found: error
          retention-days: 14
